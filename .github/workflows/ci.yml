name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production-dependency audit. Dev-only advisories (e.g. the voice-stack
      # install-time chain) must not fail CI, so we audit with --omit=dev.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # Runs all suites: unit (node:test, mocked Discord/AI), voice features,
      # security, and the midnight-restart supervisor test.
      - name: Run tests
        run: npm test
